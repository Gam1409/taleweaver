services:
  taleweaver:
    build: .
    container_name: taleweaver
    image: taleweaver:latest
    # Internal port only, Nginx will proxy to it
    expose:
      - "8000"
    volumes:
      - ${DOCKER_DATA_DIR:-./data-docker}:/app/data
      - ${DOCKER_SQLITE_DIR:-./sqlite-docker}:/app/sqlite
      - ${DOCKER_MEMORY_DB_DIR:-./db}:/app/db
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite+aiosqlite:////app/sqlite/taleweaver.db}
      MEMORY_DB_DIR: /app/db/lancedb
      TALEWEAVER_SQLITE_FILE: /app/sqlite/taleweaver.db
      TALEWEAVER_LEGACY_SQLITE_FILE: /app/data/taleweaver.db
    restart: unless-stopped
    # Enable communication with Ollama running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - taleweaver-net

  nginx:
    image: nginx:alpine
    container_name: taleweaver-nginx
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - taleweaver
    restart: always
    networks:
      - taleweaver-net

networks:
  taleweaver-net:
    driver: bridge
