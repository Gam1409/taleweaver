name: Desktop distributions

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths: [desktop/**, scripts/desktop_processes.py, scripts/build_desktop.py, scripts/smoke_desktop.py, .github/workflows/desktop.yml]
  pull_request:
    paths: [desktop/**, scripts/desktop_processes.py, scripts/build_desktop.py, scripts/smoke_desktop.py, .github/workflows/desktop.yml]

permissions:
  contents: read

jobs:
  launcher-tests:
    name: Launcher tests (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small launcher test dependencies
        run: pip install pytest pytest-asyncio pillow cryptography python-dotenv platformdirs 'filelock>=4.2.1'
      - name: Test lifecycle, readiness, browser and status icons
        run: python -m pytest -c desktop/pytest.ini desktop/tests -q

  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            executable: dist/TaleWeaver/TaleWeaver
          - os: windows-latest
            name: windows
            executable: dist/TaleWeaver/TaleWeaver.exe
          - os: macos-15
            name: macos
            executable: dist/TaleWeaver.app/Contents/MacOS/TaleWeaver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux native tray build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb dbus-x11
      - name: Install packaging environment
        run: |
          pip install 'poetry>=2,<3'
          poetry install --with packaging --extras desktop --no-interaction
      - name: Test launcher lifecycle on this platform
        run: poetry run python -m pytest -c desktop/pytest.ini desktop/tests -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build native distribution
        run: poetry run python scripts/build_desktop.py
      - name: Smoke-test built executable and measure memory
        run: poetry run python scripts/smoke_desktop.py '${{ matrix.executable }}'
      - name: Verify Linux native tray and menu initialization
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a poetry run python scripts/smoke_desktop.py --tray '${{ matrix.executable }}'
      - name: Verify Windows or macOS native tray and menu initialization
        if: runner.os != 'Linux'
        run: poetry run python scripts/smoke_desktop.py --tray '${{ matrix.executable }}'
      - name: Verify bundled SQLite and RAG persistence without external models
        run: poetry run python scripts/smoke_desktop.py --storage '${{ matrix.executable }}'
      - name: Archive distribution (preserve executable permissions and macOS symlinks)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf TaleWeaver-${{ matrix.name }}-${{ runner.arch }}.tar.gz -C dist TaleWeaver.app
          else
            tar -czf TaleWeaver-${{ matrix.name }}-${{ runner.arch }}.tar.gz -C dist TaleWeaver
          fi
      - name: Archive Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TaleWeaver -DestinationPath TaleWeaver-windows-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaleWeaver-${{ matrix.name }}-${{ runner.arch }}
          path: |
            TaleWeaver-*.tar.gz
            TaleWeaver-*.zip
          retention-days: 14
